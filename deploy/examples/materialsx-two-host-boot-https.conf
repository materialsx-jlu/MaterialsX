# TLS vhosts for the isolated two-host preview rollout.
server {
    listen 80;
    server_name mx.jouhu.com api.mx.jouhu.com admin.mx.jouhu.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/materialsx-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name mx.jouhu.com;
    ssl_certificate /etc/materialsx/letsencrypt/live/materialsx-site/fullchain.pem;
    ssl_certificate_key /etc/materialsx/letsencrypt/live/materialsx-site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/materialsx/current;
    index index.html;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl;
    server_name api.mx.jouhu.com;
    ssl_certificate /etc/materialsx/letsencrypt/live/materialsx-api-admin/fullchain.pem;
    ssl_certificate_key /etc/materialsx/letsencrypt/live/materialsx-api-admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=86400" always;
    client_max_body_size 2m;
    location ^~ /ops { return 404; }
    location ^~ /v1/admin/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host api.mx.jouhu.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}

server {
    listen 443 ssl;
    server_name admin.mx.jouhu.com;
    ssl_certificate /etc/materialsx/letsencrypt/live/materialsx-api-admin/fullchain.pem;
    ssl_certificate_key /etc/materialsx/letsencrypt/live/materialsx-api-admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host admin.mx.jouhu.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
