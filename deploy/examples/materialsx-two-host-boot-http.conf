# Temporary HTTP vhosts for the two-host rollout. Existing vhosts stay intact.
# ACME files live at /var/www/materialsx-acme/.well-known/acme-challenge/.
server {
    listen 80;
    server_name mx.jouhu.com;
    root /var/www/materialsx/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/materialsx-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    server_name api.mx.jouhu.com admin.mx.jouhu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/materialsx-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        add_header Retry-After 60 always;
        return 503;
    }
}
