name: Publish MaterialsX website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MATERIALSX_SITE_RELEASE_CHANNEL: stable
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix website run check
      - name: Build for GitHub Pages
        run: npm --prefix website run build
        env:
          SITE_BASE_PATH: /MaterialsX/
          SITE_ORIGIN: https://materialsx-jlu.github.io
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
